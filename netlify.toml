[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Tier 3: every reports.scrollmedia.co surface carries client-confidential
    # data behind the client-side access-code gate. The gate hides content
    # visually but the HTML is still served, so crawlers must be told not to
    # index any of it. Site-wide noindex closes the indexing leak.
    X-Robots-Tag = "noindex, nofollow"

# Tier 2 client-data snapshot: belt-and-suspenders noindex at the header level,
# matching the page-level meta robots + robots.txt Disallow.
[[headers]]
  for = "/upandrunningoh/performance-snapshot/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/launchparty"
  to = "/launchparty/"
  status = 301

[[redirects]]
  from = "/skinbybrownlee"
  to = "/skinbybrownlee/"
  status = 301

[[redirects]]
  from = "/defineoakley"
  to = "/defineoakley/"
  status = 301

[[redirects]]
  from = "/launchparty/january2026"
  to = "/launchparty/january2026/"
  status = 301
