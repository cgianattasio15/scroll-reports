name: Monthly Metricool Pull

# Fills the two data-heavy sections of each v8 report shell from Metricool at build time
# (the All Posts This Month table + the Top 3 Posts cards), then commits the injected shells.
# No runtime API calls ship to the client: the data is baked into static HTML here.
# The token is read from the METRICOOL_TOKEN repository secret; METRICOOL_USER_ID stays a
# code global in outlier_engine.py (it is an identifier, not a credential).

on:
  schedule:
    # 10:00 UTC on the 1st of each month = 6:00am EDT (summer) / 5:00am EST (winter).
    # GitHub cron is UTC and does not observe DST; the winter 1-hour drift is harmless
    # because this is a review-first data pull, not a client-facing send.
    - cron: '0 10 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to pull (1-12). Blank = the month that just ended.'
        required: false
      year:
        description: 'Year (e.g. 2026). Blank = derived with month.'
        required: false

permissions:
  contents: write   # commit the injected shells back to the repo

concurrency:
  group: metricool-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Resolve reporting period
        id: period
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            M="${{ github.event.inputs.month }}"
            Y="${{ github.event.inputs.year }}"
            [ -z "$Y" ] && Y="$(date -u +%Y)"
          else
            # The month that just ended: "yesterday" from the 1st lands in the prior month.
            M="$(date -u -d 'yesterday' +%m)"
            Y="$(date -u -d 'yesterday' +%Y)"
          fi
          M="$(echo "$M" | sed 's/^0//')"
          MNAME="$(date -u -d "$Y-$M-01" +%B)"
          SLUG="$(echo "$MNAME$Y" | tr '[:upper:]' '[:lower:]')"
          echo "month=$M"           >> "$GITHUB_OUTPUT"
          echo "year=$Y"            >> "$GITHUB_OUTPUT"
          echo "month_name=$MNAME"  >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG"         >> "$GITHUB_OUTPUT"
          echo "Pulling $MNAME $Y (slug: $SLUG)"

      - name: Pull all clients and inject All Posts + Top 3
        env:
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
        working-directory: _skill-performance-reports/scripts
        run: |
          set -e
          M="${{ steps.period.outputs.month }}"
          Y="${{ steps.period.outputs.year }}"
          SLUG="${{ steps.period.outputs.slug }}"
          mkdir -p "$GITHUB_WORKSPACE/summaries"
          for CLIENT in laneandkate upandrunningoh defineoakley shoplaunchparty measactive carlsdeli; do
            SHELL_PATH="../../$CLIENT/$SLUG/index.html"
            if [ -f "$SHELL_PATH" ]; then
              echo "::group::$CLIENT"
              python3 inject_report_data.py \
                --client "$CLIENT" --month "$M" --year "$Y" \
                --inject "$SHELL_PATH" \
                --summary-out "$GITHUB_WORKSPACE/summaries/$CLIENT.json" \
                || echo "::warning::pull failed for $CLIENT (continuing)"
              echo "::endgroup::"
            else
              echo "::warning::no shell at $CLIENT/$SLUG/index.html; scaffold it first (skipping)"
            fi
          done

      - name: Build run summary
        if: always()
        run: python3 _skill-performance-reports/scripts/build_run_summary.py summaries

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricool-pull-summary-${{ steps.period.outputs.slug }}
          path: summaries/
          retention-days: 30

      - name: Commit injected shells
        run: |
          git config user.name "scroll-metricool-bot"
          git config user.email "chase@getscrollmedia.com"
          # summaries/ is a run artifact, not part of the repo
          rm -rf summaries
          if git diff --quiet; then
            echo "No shell changes to commit."
          else
            git add -A
            git commit -m "Metricool data injection — ${{ steps.period.outputs.month_name }} ${{ steps.period.outputs.year }}"
            git push
          fi
