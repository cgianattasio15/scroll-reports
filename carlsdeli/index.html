<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Carl's Deli – Performance Reports | Scroll Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --shadow:#151516;
      --azure:#0c3387;
      --lucid:#cbe9ff;
      --hl:#e2ed7a;
      --ink-mid:rgba(255,255,255,0.65);
      --ink-light:rgba(255,255,255,0.35);
      --porcelain:#f2f3f4;
      --ghost:#fafdff;
      --border:rgba(21,21,22,0.08);
      --text:#151516;
      --text-muted:#5a5a5c;
      --green:#10b981;
      --amber:#f59e0b;
      --red:#ef4444;
      --purple:#7c3aed;
    }
    body{font-family:'Source Sans 3',sans-serif;background:var(--ghost);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding:2rem 1.5rem}

    .container{max-width:1100px;margin:0 auto}

    .header{background:linear-gradient(135deg,#151516 0%,#1a1a1c 100%);color:white;padding:2.5rem;border-radius:12px;margin-bottom:3rem;position:relative;overflow:hidden}
    .header::before{content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(12,51,135,.18),transparent 70%);border-radius:50%}
    .header-inner{position:relative;z-index:1}
    .back-link{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink-mid);text-decoration:none;font-size:.875rem;margin-bottom:1.5rem;transition:color .2s}
    .back-link:hover{color:white}
    .back-link::before{content:'←';font-size:1rem}

    h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:.75rem}
    .handle{font-size:1.125rem;color:var(--lucid);margin-bottom:1.25rem}

    .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-top:1.5rem}
    .meta-item{display:flex;flex-direction:column;gap:.25rem}
    .meta-label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light)}
    .meta-value{font-size:.9375rem;color:white;line-height:1.4}

    .reports-section{margin-top:3rem}
    .section-title{font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:1.5rem}

    .reports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}

    .empty-state{background:white;border:1px dashed var(--border);border-radius:10px;padding:2.5rem 2rem;text-align:center}
    .empty-state .es-eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--azure);margin-bottom:.75rem}
    .empty-state .es-title{font-size:1.25rem;font-weight:700;color:var(--text);margin-bottom:.5rem}
    .empty-state .es-sub{font-size:.9375rem;color:var(--text-muted);max-width:440px;margin:0 auto}

    @media (max-width: 768px){
      body{padding:1.5rem 1rem}
      .header{padding:2rem 1.5rem}
      h1{font-size:2rem}
      .meta-grid{grid-template-columns:1fr 1fr}
      .reports-grid{grid-template-columns:1fr}
    }
  </style>
  <script>window.SCROLL_GATE={slug:'carlsdeli',code:'carls.scroll',title:'Private report',sub:'This report is private. Enter your access code to continue.',button:'View report'};</script>
  <script src="/access-gate.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-inner">
        <a href="/" class="back-link">Back to Dashboard</a>
        <h1>Carl's Deli</h1>
        <div class="handle">@carlsdelicincy</div>

        <div class="meta-grid">
          <div class="meta-item">
            <div class="meta-label">Niche</div>
            <div class="meta-value">Food &amp; Bev</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Subniche</div>
            <div class="meta-value">Cincinnati Deli &amp; Catering</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Package</div>
            <div class="meta-value">Signature</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Stage</div>
            <div class="meta-value">Lift</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Account Manager</div>
            <div class="meta-value">Rachel Dina</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Client Since</div>
            <div class="meta-value">April 2026</div>
          </div>
        </div>
      </div>
    </div>

    <div class="reports-section">
      <h2 class="section-title">Performance Reports</h2>

      <div class="reports-grid">
        <a href="/carlsdeli/june2026/" style="display:block;background:#fff;border:1px solid var(--border);border-radius:10px;padding:1.5rem;color:inherit;text-decoration:none;position:relative;overflow:hidden">
          <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--azure),#4f6ef7)"></div>
          <div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.375rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">June 2026 <span style="font-size:.625rem;font-weight:700;letter-spacing:.06em;padding:.2rem .5rem;border-radius:4px;background:rgba(226,237,122,.25);color:#5b6b16;border:1px solid rgba(200,217,74,.5)">First Report</span></div>
          <div style="font-size:2rem;font-weight:800;color:#059669;line-height:1;letter-spacing:-.03em">9.2<span style="font-size:.875rem;font-weight:400;color:var(--text-muted)">/10</span></div>
          <div style="font-size:.8125rem;color:var(--text-muted);margin-top:.25rem;margin-bottom:1.25rem">Inaugural report &middot; Exceptional Month</div>
          <span style="display:inline-flex;align-items:center;gap:.375rem;font-size:.8125rem;font-weight:700;color:var(--azure);padding:.45rem .8rem;border:1.5px solid rgba(12,51,135,.2);border-radius:6px">View Report &#8599;</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
